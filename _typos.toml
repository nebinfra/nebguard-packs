[files]
# Cosign signature bundles embed base64 payloads that are high-entropy by
# construction, so the dictionary matches words inside the encoded bytes.
# Same rationale as the sealed-artifact allowlist in .gitleaks.toml.
extend-exclude = ["*.bundle"]

[default.extend-words]
mis-wired = "mis-wired"
mis-match = "mis-match"
mis-route = "mis-route"

[default.extend-identifiers]
# CNCF in-toto attestation; default dictionary flags as typo of "into"
intoto = "intoto"
# `nebcli`, `nebguard`, `NebInfra`: brand names
nebcli = "nebcli"
nebguard = "nebguard"
nebinfra = "nebinfra"
NebInfra = "NebInfra"
